version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - CORS_ORIGINS=*
      - GEMINI_API_KEY=${GEMINI_API_KEY:-your_gemini_key_here}
    volumes:
      - ./data:/app/data
      - ./artifacts:/app/artifacts

  research_app:
    build:
      context: .
      dockerfile: research_app/Dockerfile
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./artifacts:/app/artifacts

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
